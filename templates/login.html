{% extends "base.html" %}
{% block title %}Access{% endblock %}
{% block content %}
<div class="panel" style="max-width:420px;margin:60px auto">
  <h2>Etched Manufacturing Test · Access key</h2>
  <p class="hint">Enter the access key provided by Etched.</p>
  {% if error %}<div class="alert err">{{ error }}</div>{% endif %}
  <form method="post">
    <div class="field"><label>Access key</label><input type="password" name="key" autofocus></div>
    <div class="actions"><button class="btn primary" type="submit">Continue</button></div>
  </form>
</div>
{% endblock %}
